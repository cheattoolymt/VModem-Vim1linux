# ===========================================================================
#  99-vmodem.conf -- VModem 用 sysctl 恒久設定
#
#  配置先: /etc/sysctl.d/99-vmodem.conf
#  反映  : sudo sysctl --system      (再起動時は systemd-sysctl が自動適用)
#
#  `make -f Makefile.linux install` および
#  `scripts/setup-gadget-linux.sh` が自動で配置する。
# ===========================================================================

# ---------------------------------------------------------------------------
#  ゲスト (Windows) からの ping を通すための設定
# ---------------------------------------------------------------------------
#  ★ なぜ必要か ★
#  libslirp はゲストの ICMP Echo を中継する時、ホスト側で ICMP ソケットを
#  開く。その手順は 2 段構え (libslirp master src/ip_icmp.c icmp_send):
#
#      so->s = slirp_socket(AF_INET, SOCK_DGRAM, IPPROTO_ICMP);
#      if (not_valid_socket(so->s)) {
#          if (errno == EAFNOSUPPORT || errno == EPROTONOSUPPORT
#           || errno == EACCES) {
#              so->so_type = IPPROTO_IP;
#              so->s = slirp_socket(AF_INET, SOCK_RAW, IPPROTO_ICMP);
#          }
#      }
#      if (not_valid_socket(so->s)) {
#          return -1;      <- ここに来るとゲストの ping は永久に無応答
#      }
#
#    1 段目 SOCK_DGRAM+IPPROTO_ICMP ("ping ソケット")
#         この sysctl に自分の gid が含まれていないと EACCES で失敗する。
#    2 段目 SOCK_RAW+IPPROTO_ICMP
#         CAP_NET_RAW が必要。無いと EPERM で失敗する。
#
#  両方失敗すると icmp_send() は -1 を返し、ゲストの ICMP Echo は
#  **ログも出さずに捨てられる**。症状は
#  「Web ブラウジングはできるのに ping 8.8.8.8 だけタイムアウトする」
#  で、TCP/UDP は一切影響を受けないため極めて紛らわしい。
#
#  ★ Debian 系の既定値の罠 ★
#    既定は `1 0`。これは「gid 1 以上 0 以下」= **空集合** である。
#    「gid 1 から 0 まで」という範囲指定ではない。
#    つまり既定では誰一人 ping ソケットを開けない。
#    lo <= gid だけを見て「gid 1000 は 1 以上だから通る」と
#    誤読しやすいので注意する事。
#
#  ★ なぜ /proc に echo するだけでは駄目なのか ★
#    sysctl は揮発性で、再起動するとカーネル既定値に戻る。
#    「昨日は ping が通ったのに今日は通らない」の原因はこれ。
#    /etc/sysctl.d/*.conf は systemd-sysctl.service が起動時に
#    読み込むので、恒久化はここに書くのが正しい。
#
#  ★ セキュリティ上の意味 ★
#    ping ソケットは ICMP Echo Request/Reply しか扱えない。
#    任意のパケットを組み立てられる raw socket (CAP_NET_RAW) とは
#    別物であり、これを開けても攻撃能力は増えない。
#    多くのディストリビューションが既定で広く開けている設定でもある。
#    それでも絞りたい場合は、vmodem を動かす gid だけを指定する:
#        net.ipv4.ping_group_range = 1000 1000
net.ipv4.ping_group_range = 0 2147483647
